name: bylaw review
description: Review pull requests against your repository's own rules and the requirements they claim to implement.
author: Tunahan Ali Ozturk
branding:
  icon: check-circle
  color: gray-dark

inputs:
  api-key:
    description: API key for the model provider. Leave empty to run only the deterministic checks.
    required: false
    default: ""
  provider:
    description: Model provider, anthropic, openai, bedrock, vertex, foundry, azure-openai or openai-compatible. Cloud providers read their credentials from the job's environment (docs/providers.md).
    required: false
    default: anthropic
  model:
    description: Model name. Defaults to claude-opus-5-5 for the Claude providers (anthropic.claude-opus-5-5 on bedrock); required for openai, azure-openai (the deployment name) and openai-compatible.
    required: false
    default: ""
  base-url:
    description: Server URL for the openai-compatible provider, such as a vLLM server the runner can reach (https://vllm.internal/v1).
    required: false
    default: ""
  effort:
    description: Reasoning effort passed to the model. Empty uses the provider default (high for anthropic, none sent to openai).
    required: false
    default: ""
  fail-on:
    description: Fail the check when a finding at or above this severity remains (critical, high, medium, low, suggestion or none).
    required: false
    default: none
  github-token:
    description: Token used to read the pull request and write comments.
    required: false
    default: ${{ github.token }}
  jira-email:
    description: Account email for Jira Cloud, with jira-api-token. Used only when .bylaw.toml has a [jira] table (docs/trackers.md).
    required: false
    default: ""
  jira-api-token:
    description: Jira Cloud API token. Pass it from a secret.
    required: false
    default: ""
  azure-devops-token:
    description: Azure DevOps personal access token with Work Items (Read). Used only when .bylaw.toml has an [azure_boards] table. Pass it from a secret.
    required: false
    default: ""
  linear-api-key:
    description: Linear personal API key with read access. Used only when .bylaw.toml has a [linear] table. Pass it from a secret.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Pinned by commit: this action holds an API key and a write token.
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
    - name: Review the pull request
      shell: bash
      # Inputs travel as environment variables and are quoted below, so nothing a workflow passes in can
      # become part of the command line.
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BYLAW_API_KEY: ${{ inputs.api-key }}
        BYLAW_PROVIDER: ${{ inputs.provider }}
        BYLAW_MODEL: ${{ inputs.model }}
        BYLAW_EFFORT: ${{ inputs.effort }}
        BYLAW_BASE_URL: ${{ inputs.base-url }}
        BYLAW_FAIL_ON: ${{ inputs.fail-on }}
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-api-token }}
        AZURE_DEVOPS_TOKEN: ${{ inputs.azure-devops-token }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        BYLAW_PR: ${{ github.event.pull_request.number }}
      run: |
        args=(review --pr "$BYLAW_PR" --post --provider "$BYLAW_PROVIDER" --fail-on "$BYLAW_FAIL_ON")
        if [ -n "$BYLAW_MODEL" ]; then args+=(--model "$BYLAW_MODEL"); fi
        if [ -n "$BYLAW_EFFORT" ]; then args+=(--effort "$BYLAW_EFFORT"); fi
        if [ -n "$BYLAW_BASE_URL" ]; then args+=(--base-url "$BYLAW_BASE_URL"); fi
        # A cloud provider's credential chain is an optional extra, installed only for that provider.
        extras=()
        case "$BYLAW_PROVIDER" in
          bedrock) extras=(--extra bedrock) ;;
          vertex) extras=(--extra vertex) ;;
          foundry | azure-openai) extras=(--extra azure) ;;
        esac
        uv run --project "$GITHUB_ACTION_PATH" --locked --no-dev "${extras[@]}" bylaw "${args[@]}"
