[project]
name = "bylaw"
version = "0.4.0"
description = "Reviews pull requests against your repository's own rules and requirements."
readme = "README.md"
keywords = ["code-review", "pull-requests", "github-actions", "llm", "requirements", "editorconfig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tunahan Ali Ozturk" }]
dependencies = [
    "pydantic>=2.14.1",
    "httpx>=0.28.1",
    "anthropic>=1.14.0",
    "openai>=3.31.0",
    "httpx2>=2.13.1",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/tunahanaliozturk/bylaw"
Documentation = "https://github.com/tunahanaliozturk/bylaw#readme"
Issues = "https://github.com/tunahanaliozturk/bylaw/issues"
Changelog = "https://github.com/tunahanaliozturk/bylaw/blob/main/CHANGELOG.md"

[project.scripts]
bylaw = "bylaw.cli:main"
bylaw-app = "bylaw.app.server:main"

[project.optional-dependencies]
app = [
    "pyjwt[crypto]>=2.15.1",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]
mcp = [
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "bylaw[app]",
    "bylaw[mcp]",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The evaluation set holds deliberately vulnerable code; it stays in the repository, not the package.
exclude = ["eval", "docs", "plugin", ".github", ".agents", ".claude-plugin"]

[tool.ruff]
line-length = 110
target-version = "py313"
# Markdown is prose; its code samples are illustrations, not code ruff should rewrite.
extend-exclude = ["docs", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "ARG", "PL", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "PLR2004", "ARG002"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.uv.sources]
bylaw = { workspace = true }
