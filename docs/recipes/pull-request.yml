# Reviews pull requests from branches in this repository. Fork pull requests get a notice instead;
# use pull-request-target.yml for those.
name: bylaw

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: bylaw-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # @v0 follows the newest 0.x release. A tag can be moved, so pin the full commit SHA of a release
      # instead, with the tag in a comment so Dependabot keeps it current; see the README.
      - uses: tunahanaliozturk/bylaw@v0
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
