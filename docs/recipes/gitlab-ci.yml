# bylaw on GitLab merge requests. Add this job to your .gitlab-ci.yml.
#
# Two CI/CD variables (Settings > CI/CD > Variables), both masked:
#
#   GITLAB_TOKEN       A project access token with the Developer role and the `api` scope. bylaw reads
#                      the merge request, posts as the token's bot user, and trusts its review memory only
#                      in notes that user wrote. CI_JOB_TOKEN will not do: it can read a merge request but
#                      not its diff, and it cannot post a note.
#                      Leave "Protect variable" off unless you know your setup lets it through: since
#                      GitLab 18.1 a protected variable reaches a merge request pipeline only when a
#                      Maintainer allows it and both branches are protected and in this project. Feature
#                      branches usually are not, and a fork's pipeline never gets one.
#   ANTHROPIC_API_KEY  Optional. Without it bylaw still runs its own checks; with it a model reviews too.
#
# Merge requests from forks run their pipeline in the fork, without these variables, so bylaw prints a
# note and exits cleanly. Read "Merge requests from forks" in docs/hosts.md before you run a fork's
# pipeline in this project: that pipeline gets the token, and its job definition comes from the fork.
bylaw:
  stage: test
  # Pinned by digest: a tag can be moved to another image, a digest cannot. To update, read the digest
  # the tag points at now and review the change like any other:
  #   docker buildx imagetools inspect ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # A newer push makes this run pointless, and GitLab can cancel it when the project allows that.
  interruptible: true
  variables:
    # No checkout: bylaw reads the change, the rules and the issues through the API, so cloning the merge
    # request's branch only costs time and puts its files in the job's directory, where nothing should
    # read them. (uvx already ignores a uv.toml or pyproject.toml there; this keeps it that way.)
    GIT_STRATEGY: none
    # The first release with GitLab support; pin it so an update is a change you review.
    BYLAW_VERSION: "0.6.0"
    # bylaw@0.6.0 pins bylaw, not what it depends on: uvx resolves those afresh on every run. This keeps
    # the resolution to packages published by the time of that release, so a dependency released later,
    # compromised or not, never reaches the job. Move it forward together with BYLAW_VERSION.
    UV_EXCLUDE_NEWER: "2026-10-19T12:00:00Z"
  script:
    # Add --fail-on high to fail the pipeline while a high or critical finding is open.
    - uvx "bylaw@${BYLAW_VERSION}" review --gitlab-mr "$CI_MERGE_REQUEST_IID" --project "$CI_MERGE_REQUEST_PROJECT_ID" --post
