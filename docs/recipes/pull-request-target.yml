# Reviews fork pull requests once a maintainer adds the `bylaw` label (ADR 0006).
# bylaw reads the diff through the API and never runs the pull request's code. Do not add
# actions/checkout of the pull request head to this workflow: that is what makes
# pull_request_target dangerous.
name: bylaw

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: bylaw-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Runs when the `bylaw` label is added, and on new pushes while it is on; other labels do not re-run it.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'bylaw') &&
      (github.event.action != 'labeled' || github.event.label.name == 'bylaw')
    runs-on: ubuntu-latest
    steps:
      - uses: tunahanaliozturk/bylaw@v0
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
