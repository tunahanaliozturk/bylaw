# Reviews fork pull requests once a maintainer adds the `bylaw` label (ADR 0006).
# bylaw reads the diff through the API and never runs the pull request's code. Do not add
# actions/checkout of the pull request head to this workflow: that is what makes
# pull_request_target dangerous.
#
# The label stays on for new pushes, so a fork author decides how often this runs. Cap what one pull
# request may spend in .bylaw.toml on the base branch:
#
#   [budget]
#   pr_tokens = 500000
name: bylaw

on:
  pull_request_target:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    # Runs when the `bylaw` label is added, and on new pushes while it is on; other labels do not re-run it.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'bylaw') &&
      (github.event.action != 'labeled' || github.event.label.name == 'bylaw')
    # At job level: a run skipped by the condition above never takes the group, so it cannot cancel a
    # review in progress. Runs queue instead of cancelling: a cancelled run never writes its tokens to
    # the summary, so a fork author pushing again and again would get reviews that `pr_tokens` never
    # counts. A queue keeps one pending run; GitHub drops the older pending one.
    concurrency:
      group: bylaw-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # @v0 follows the newest 0.x release. A tag can be moved, so pin the full commit SHA of a release
      # instead, with the tag in a comment so Dependabot keeps it current; see the README.
      - uses: tunahanaliozturk/bylaw@v0
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
